[platformio]
default_envs = stage1-uart

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
  -DBOARD_HAS_PSRAM
monitor_speed = 115200

[env:stage1-uart]
build_flags = ${env.build_flags} -DDIAG_STAGE=1

[env:stage1-safe-flash]
board_build.f_flash = 80000000L
build_flags = ${env.build_flags} -DDIAG_STAGE=1

[env:stage2-usb]
build_flags = ${env.build_flags} -DDIAG_STAGE=2

[env:stage3-led-power]
build_flags = ${env.build_flags} -DDIAG_STAGE=3

[env:stage4-led-data]
build_flags = ${env.build_flags} -DDIAG_STAGE=4

[env:stage-usb-lines]
build_flags = ${env.build_flags} -DDIAG_STAGE=1 -DUSB_LINE_TEST=1
