[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.partitions = default_16MB.csv
board_build.extra_flags =
  -DARDUINO_ESP32S3_DEV
  -DARDUINO_USB_MODE=0
  -DARDUINO_RUNNING_CORE=1
  -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; This board is used as a wired USB device only. Keep the BLE code paths
  ; compiled out so radio advertising and wireless transport cannot interfere
  ; with USB enumeration during host boot.
  -DCODEX_BLE_ENABLED=0
  -DCODEX_LOW_POWER_ENABLED=0
  -DCODEX_JOYSTICK_ENABLED=0
  -DCODEX_BATTERY_ENABLED=0

upload_speed = 921600
monitor_speed = 115200

lib_deps =
  bblanchon/ArduinoJson @ ^6.21.5
